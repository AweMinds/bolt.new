name: CI/CD

on:
  push:
    branches:
      - master
      - ci
  pull_request:

env:
  REGISTRY: registry.cn-shanghai.aliyuncs.com
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      - name: Run type check
        run: pnpm run typecheck

      # - name: Run ESLint
      #   run: pnpm run lint

      - name: Run tests
        run: pnpm run test

  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - run: |
          echo 本次构建的版本为：${{ github.ref_name }}
          echo 账号：${{ secrets.ACR_USERNAME }}
          env

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4.4.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Get current date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Docker Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          #        tags: ${{ steps.meta.outputs.tags }}
          tags: |
            registry.cn-shanghai.aliyuncs.com/aweminds/bolt.new:latest
            registry.cn-shanghai.aliyuncs.com/aweminds/bolt.new:${{ steps.date.outputs.today }}
          labels: ${{ steps.meta.outputs.labels }}

    deploy:
      runs-on: ubuntu-latest
      needs: [ build_and_publish ]
      permissions:
        contents: write
        packages: write

      steps:
        - name: Check out the repo
          uses: actions/checkout@v4

        - name: Upload restart script
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            port: ${{ secrets.SSH_PORT || 22 }}
            source: "scripts/restart_docker.sh"
            target: "/root/llm/bolt.new"

        - name: Deploy via SSH
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            port: ${{ secrets.SSH_PORT || 22 }}  # 如未设置，默认 22
            script: |
              chmod +x /root/llm/bolt.new/scripts/restart_docker.sh
              /root/llm/bolt.new/scripts/restart_docker.sh

