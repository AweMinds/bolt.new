version: '3.8'

services:
  bolt:
    image: registry.cn-shanghai.aliyuncs.com/aweminds/bolt.new:latest
    container_name: bolt.new
    ports:
      - "5173:5173"
    volumes:
      # 挂载 .env.local 文件（如果存在）
      - ./.env.local:/app/.env.local:ro
    environment:
      - NODE_ENV=development
    restart: unless-stopped
